<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitobim — kitobxon kundaligi va kitobxonlar davrasi</title>
<meta name="description" content="Kitobxon daftaringiz endi telefonda: qaysi kitobni o'qiyotganingiz, qaysi betga kelganingiz, o'qigan kitoblaringiz va saboqlaringiz — hammasi bir joyda.">
<meta name="theme-color" content="#FF6B1A">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitobim"><meta name="application-name" content="Kitobim">
<meta property="og:title" content="Kitobim — kitobxon kundaligi"><meta property="og:description" content="Kitobxon daftaringiz endi telefonda"><meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,700;1,700&family=Great+Vibes&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f4f4f6;--card:#fff;--soft:#f1f1f4;--ink:#16161a;--ink2:#4a4a52;--muted:#8b8b93;--line:#ececf0;
  --or:#ff6b1a;--or2:#f04e1c;--or-soft:#fff1e8;--green:#3bb54a;--green-soft:#e9f8ec;--blue:#3d7bf0;--red:#e5484d;
  --grad:linear-gradient(135deg,#ff8a2b 0%,#ff6b1a 45%,#f04e1c 100%);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(20,20,30,.05);--r:20px;--side:264px;
  --shelf:linear-gradient(180deg,#f3c79c,#e2a676 60%,#c98a5a);
}
body.dark{--bg:#0b0b0d;--card:#18181b;--soft:#232328;--ink:#f3f3f5;--ink2:#c9c9cf;--muted:#8e8e96;--line:#2a2a30;--or-soft:#3a1f12;--green-soft:#173b20;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;width:100%;padding:13px 15px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);color:var(--ink);outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--or);background:var(--card)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
label{display:block;font-size:13px;color:var(--muted);margin:15px 0 7px;font-weight:600}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);padding:22px 16px;display:flex;flex-direction:column;gap:6px;background:var(--bg);z-index:30;overflow-y:auto}
.main{margin-left:var(--side);min-height:100vh;padding:26px 34px 60px 10px}
.main-in{background:var(--card);border-radius:28px;min-height:calc(100vh - 52px);padding:30px 34px 50px;box-shadow:var(--shadow)}
body.dark .main-in{background:#000}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:24px;letter-spacing:-.04em;padding:4px 8px 14px}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 12px rgba(255,107,26,.35)}
.logo i svg{width:100%;height:100%}
.logo em{font-style:normal;color:var(--or)}
.sbox{position:relative;margin-bottom:10px}
.sbox input{padding-left:42px;background:var(--card);border-radius:14px}
body.dark .sbox input{background:var(--soft)}
.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;font-weight:600;font-size:15px;color:var(--ink2)}
.nav a svg{width:21px;height:21px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
body.dark .nav a.on{background:var(--soft)}
.side .grow{flex:1}
.side-prem{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;font-weight:700;padding:13px;border-radius:14px;box-shadow:0 8px 18px rgba(255,107,26,.3)}
.tgl-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:600;color:var(--ink2)}
.me-card{display:flex;align-items:center;gap:11px;padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
body.dark .me-card{background:var(--soft)}
.me-card b{flex:1;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-note{font-size:12px;color:var(--or2);background:var(--or-soft);padding:9px 12px;border-radius:12px;line-height:1.4;margin-top:6px}

.mtop{display:none}
.bnav{display:none}

/* ---------- common ---------- */
.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.ph h1{font-size:28px;font-weight:800}
.ph small{display:block;color:var(--muted);font-size:14px;margin-bottom:2px}
.back{width:42px;height:42px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.back svg{width:20px;height:20px}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.ibtn svg{width:21px;height:21px}
.ibtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--or);border:2px solid var(--soft)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
body.dark .card,.main-in .card{background:var(--soft);box-shadow:none}
body:not(.dark) .main-in .card{background:var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:32px 0 14px}
.sec h2{font-size:21px;font-weight:800}
.sec a{font-size:14px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:3px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:14.5px;transition:transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--or);color:#fff}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:#fdeceb;color:#d33b30}
body.dark .btn.danger{background:#3a1616}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:11px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btns .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14.5px;line-height:1.55}
.empty .ic{font-size:44px;margin-bottom:8px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px}
.t-reading{background:var(--or-soft);color:var(--or2)}
.t-done{background:var(--green-soft);color:#2a9a3b}
.t-plan{background:#eaf0fd;color:var(--blue)}
body.dark .t-plan{background:#16233f}
.t-gift{background:#fdecef;color:#c53a5a}
body.dark .t-gift{background:#3a1622}
.stars{color:var(--or);letter-spacing:1px}
.skel{background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 15px;border-radius:12px;background:var(--soft);font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip span{color:var(--muted);font-weight:500}
.chip.on{background:var(--ink);color:var(--bg)}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:18px}
.tabs button{flex:1;padding:14px 8px;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1.5px;height:3px;border-radius:3px;background:var(--or)}

/* ---------- avatar & covers ---------- */
.ava{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px;text-transform:uppercase}
.ava.ring{box-shadow:0 0 0 2.5px var(--card),0 0 0 4.5px var(--or)}
.cover{flex:0 0 auto;width:96px;height:138px;border-radius:4px 9px 9px 4px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px 9px 9px 13px;color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.2),inset 3px 0 0 rgba(0,0,0,.18)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.14),transparent)}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 12%,rgba(255,255,255,.24),transparent 55%)}
.cover .ca{font-size:8px;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-weight:600;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .ct{font-family:Lora,Georgia,serif;font-weight:700;font-size:14px;line-height:1.15;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover .cl{width:18px;height:2px;background:rgba(255,255,255,.7);border-radius:2px;position:relative;z-index:1}
.cover.xs{width:44px;height:64px;padding:5px 4px 5px 7px}.cover.xs .ct{font-size:7.5px}.cover.xs .ca{font-size:5px}.cover.xs .cl{display:none}
.cover.sm{width:62px;height:90px;padding:6px 5px 6px 9px}.cover.sm .ct{font-size:9.5px}.cover.sm .ca{font-size:6px}
.cover.lg{width:190px;height:274px;padding:18px 16px 16px 22px;border-radius:5px 13px 13px 5px;box-shadow:0 26px 50px rgba(0,0,0,.3),inset 4px 0 0 rgba(0,0,0,.18)}
.cover.lg .ct{font-size:25px;-webkit-line-clamp:6}.cover.lg .ca{font-size:11px}.cover.lg .cl{width:28px;height:3px}

/* ---------- home ---------- */
.cont{border-radius:24px;background:var(--soft);padding:22px 24px 0;position:relative;overflow:hidden;min-height:240px;display:flex;flex-direction:column}
.cont h3{font-size:17px}
.cont .shelf{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--shelf);border-radius:0 0 24px 24px}
.cont .shelf::before{content:"";position:absolute;left:0;right:0;top:-8px;height:10px;background:linear-gradient(180deg,#f7d7b7,#e7b183);border-radius:6px 6px 0 0}
.cont .on-shelf{display:flex;gap:20px;align-items:flex-end;margin-top:auto;position:relative;z-index:1;padding-bottom:30px}
.cont .info{flex:1;min-width:0;padding-bottom:10px}
.cont .info h4{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:12px 0 8px}
.pb i{display:block;height:100%;background:var(--grad);border-radius:5px}
.marra-c{border-radius:24px;background:var(--soft);padding:20px 22px}
.marra-c .in{display:flex;gap:18px;align-items:center;margin-top:12px}
.ring{position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .lbl small{font-size:11.5px;color:var(--muted);font-weight:500}
.ring .lbl b{font-size:25px;font-weight:800;letter-spacing:-.02em}
.ring .lbl span{font-size:11.5px;color:var(--muted)}
.week{display:flex;justify-content:space-between;background:var(--card);border-radius:16px;padding:10px 8px;flex:1}
body.dark .week{background:#0f0f12}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.week b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;background:var(--soft);color:var(--muted)}
.week .on b{background:var(--green);color:#fff}
.week .td b{box-shadow:0 0 0 2px var(--or);color:var(--or)}
.week .td.on b{color:#fff}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini2 div{background:var(--card);border-radius:14px;padding:12px 14px}
body.dark .mini2 div{background:#0f0f12}
.mini2 small{color:var(--muted);font-size:12.5px;display:block}
.mini2 b{font-size:22px;font-weight:800}
.mini2 b span{font-size:13px;font-weight:600}
.banner{border-radius:24px;background:var(--grad);color:#fff;padding:30px 34px;margin-top:22px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;cursor:pointer}
.banner::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12)}
.banner h2{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1}
.banner p{margin:10px 0 18px;opacity:.92;font-weight:500;font-size:15px}
.banner .bw{background:#fff;color:var(--or2);padding:11px 18px;border-radius:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.banner .art{font-size:90px;position:relative;z-index:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.15))}
.banner.moodb{background:linear-gradient(120deg,#6a7ff0,#a07ae8 50%,#f08a9a)}
.shelfrow{display:flex;gap:16px;overflow-x:auto;margin:0 -6px;padding:4px 6px 14px;scrollbar-width:thin;scroll-snap-type:x mandatory}
.tile{flex:0 0 178px;border-radius:20px;overflow:hidden;cursor:pointer;scroll-snap-align:start;background:var(--soft)}
.tile .tp{height:184px;display:flex;align-items:center;justify-content:center;position:relative}
.tile .bdg{position:absolute;top:10px;right:10px;background:var(--card);border-radius:8px;padding:3px 7px;font-size:11.5px;font-weight:700;color:var(--ink)}
.tile .bt{padding:12px 14px 14px}
.tile h4{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}

/* ---------- shelf list ---------- */
.brow{display:flex;gap:14px;align-items:center;border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer;background:var(--soft)}
.brow .info{flex:1;min-width:0}
.brow h3{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .au{font-size:13px;color:var(--muted);margin-top:2px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.shelf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}

/* ---------- book page ---------- */
.bk{display:grid;grid-template-columns:300px 1fr;gap:40px}
.bk .left{position:sticky;top:20px;align-self:start;text-align:center}
.bk .glow{border-radius:26px;padding:34px 0 30px;background:radial-gradient(circle at 50% 40%,var(--gl,rgba(255,107,26,.25)),transparent 70%)}
.bk h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
.bk .au{font-size:16px;color:var(--muted);margin-top:6px}
.bk .au b{color:var(--ink)}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0 20px;font-size:14px;color:var(--muted)}
.kv b{color:var(--ink)}
.facts{border-radius:18px;background:var(--soft);padding:4px 18px;margin-top:18px}
.facts div{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.facts div:last-child{border:0}
.facts span{color:var(--muted)}
.facts b{text-align:right}
.ava-stack{display:flex}
.ava-stack .ava{width:40px;height:40px;font-size:15px;margin-left:-10px;box-shadow:0 0 0 3px var(--card)}
body.dark .ava-stack .ava{box-shadow:0 0 0 3px #000}
.ava-stack .ava:first-child{margin-left:0}

/* ---------- posts ---------- */
.post{border-radius:20px;background:var(--soft);padding:18px;margin-bottom:12px}
.post .hd{display:flex;gap:12px;align-items:flex-start}
.post .hd .nm{flex:1;min-width:0}
.post .hd b{font-size:15px}
.post .hd small{color:var(--muted);font-size:13px}
.post .tx{margin:10px 0 0 56px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.post .tx.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.post .more{margin-left:56px;color:var(--muted);font-weight:600;font-size:13.5px;margin-top:6px;display:inline-block}
.post .att{margin:12px 0 0 56px;border-radius:16px;background:var(--card);padding:12px;display:flex;gap:14px;align-items:center;cursor:pointer}
body.dark .post .att{background:#0f0f12}
.post .att h4{font-size:15px}
.post .att small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.post .att em{font-style:normal;font-weight:700;font-size:12.5px;display:block;margin-top:10px}
.post .acts{display:flex;gap:22px;margin:12px 0 0 56px;color:var(--muted);font-size:14px}
.post .acts button{display:flex;align-items:center;gap:6px;color:var(--muted)}
.post .acts button.on{color:#e0475a}
.post .acts svg{width:19px;height:19px}
.post .cmts{margin:12px 0 0 56px;border-top:1px solid var(--line);padding-top:10px}
.post .cmt{display:flex;gap:10px;padding:8px 0;font-size:14px}
.post .cmt .ava{width:30px;height:30px;font-size:12px}
.post .cmt b{font-size:13.5px}
.composer{border-radius:20px;background:var(--soft);padding:16px;margin-bottom:18px}
.composer textarea{background:transparent;border:0;min-height:60px;padding:8px 4px}
.composer .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.composer select{width:auto;max-width:230px;padding:9px 12px;font-size:13.5px;border-radius:11px;background:var(--card)}
.cnt{font-size:12.5px;color:var(--muted);margin-left:auto}
.davra{display:grid;grid-template-columns:1fr 330px;gap:28px}
.davra .right{position:sticky;top:20px;align-self:start}
.pcard{border-radius:20px;overflow:hidden;background:var(--soft)}
.pcard .cv{height:96px;background:var(--grad)}
.pcard .bd{padding:0 18px 18px}
.pcard .ava{width:72px;height:72px;font-size:28px;margin-top:-36px;box-shadow:0 0 0 4px var(--soft)}
.urow{display:flex;gap:12px;align-items:center;padding:10px 0}
.urow .info{flex:1;min-width:0}
.urow b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow small{color:var(--muted);font-size:12.5px}

/* ---------- profile ---------- */
.prof{display:grid;grid-template-columns:300px 1fr;gap:28px}
.prof.other{grid-template-columns:1fr}
.prof>*,.grid2>*,.davra>*,.bk>*,.mgrid>*{min-width:0}
.prog{border-radius:16px;background:var(--grad);color:#fff;padding:14px 16px;font-size:13px;font-weight:600;line-height:1.35;display:flex;gap:10px;align-items:center}
.menu{border-radius:18px;background:var(--soft);overflow:hidden;margin-top:12px}
.mi{display:flex;align-items:center;gap:13px;padding:13px 15px;width:100%;text-align:left;font-size:15px;font-weight:600}
.mi+.mi{border-top:1px solid var(--line)}
.mi .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;font-size:16px}
.mi .ic svg{width:18px;height:18px}
.mi > span:not(.ic){flex:1}
.mi em{font-style:normal;color:var(--muted);font-size:13.5px;font-weight:500}
.mi .ch{color:var(--muted)}
.mlabel{font-size:13px;color:var(--muted);font-weight:600;margin:18px 4px 0}
.pcover{height:200px;border-radius:24px;background:var(--grad);position:relative}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:-64px;padding:0 20px;position:relative}
.phead .ava{width:128px;height:128px;font-size:50px;box-shadow:0 0 0 5px var(--card)}
body.dark .phead .ava{box-shadow:0 0 0 5px #000}
.pname{padding:14px 20px 0}
.pname h1{font-size:28px;font-weight:800}
.pname .sub{color:var(--muted);margin-top:6px;font-size:14.5px;display:flex;gap:14px;flex-wrap:wrap}
.pname .fol{margin-top:12px;font-size:15px;display:flex;gap:16px}
.pname .fol b{font-weight:800}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.sts div{border-radius:16px;background:var(--soft);padding:14px 16px}
.sts small{color:var(--muted);font-size:13px;display:block}
.sts b{font-size:22px;font-weight:800;display:block;margin-top:4px}
.prem-strip{border-radius:16px;background:var(--grad);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;cursor:pointer}
.prem-strip b{display:block}
.prem-strip small{opacity:.9}
.prem-strip span{background:rgba(255,255,255,.2);border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.tg{width:46px;height:28px;border-radius:20px;background:#cfcfd6;position:relative;transition:.2s;flex:0 0 auto}
body.dark .tg{background:#3a3a40}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--or)}
.tg.on::after{left:21px}

/* ---------- marra ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.tree{width:200px;height:200px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:96px;position:relative}
.tree::after{content:"";position:absolute;bottom:42px;width:96px;height:16px;border-radius:50%;background:#c9733d;opacity:.6;z-index:0}
.tree span{position:relative;z-index:1}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ms div{border-radius:16px;background:var(--soft);padding:14px 8px;text-align:center;position:relative}
.ms .e{font-size:30px;filter:grayscale(1);opacity:.45}
.ms .got .e{filter:none;opacity:1}
.ms .got{box-shadow:inset 0 0 0 2px var(--green)}
.ms b{display:block;font-size:14px;margin-top:6px}
.ms small{color:var(--or);font-weight:700;font-size:12px}
.lb .urow{border-bottom:1px solid var(--line)}
.lb .rk{width:30px;font-weight:800;color:var(--muted);text-align:center}
.lb .me{background:var(--or-soft);border-radius:14px;padding:10px;margin:4px -10px}
.info-note{border-radius:14px;background:var(--or-soft);color:var(--or2);padding:14px 16px;font-size:14px;line-height:1.5;margin-top:14px}

/* ---------- sheet ---------- */
.ov{position:fixed;inset:0;background:rgba(10,10,14,.5);z-index:60;display:flex;align-items:center;justify-content:center;animation:fd .2s;padding:20px}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:26px;padding:24px 24px 26px;animation:pop .22s cubic-bezier(.2,.8,.2,1);position:relative}
.sheet h2{font-size:21px;font-weight:800}
.sheet .sub{color:var(--muted);font-size:14px;margin-top:4px}
.sheet .x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:18px;z-index:2}
.grab{display:none}
@keyframes pop{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{padding:11px 4px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:13px 16px;margin-top:15px;cursor:pointer}
.switch span{font-weight:600;font-size:14.5px}
.rate{display:flex;gap:8px;font-size:32px}
.rate button{color:var(--line);line-height:1}
.rate button.on{color:var(--or)}
.fs{margin-top:22px}
.fs h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--or)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;font-size:14.5px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600;text-align:right}
.note{background:var(--or-soft);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.log div{position:relative;padding:0 0 16px 22px;font-size:14px;border-left:2px solid var(--line);margin-left:8px}
.log div:last-child{border-color:transparent}
.log div::before{content:"";position:absolute;left:-7px;top:1px;width:12px;height:12px;border-radius:50%;background:var(--or);box-shadow:0 0 0 3px var(--or-soft)}
.log small{color:var(--muted);display:block;margin-top:2px}
.log p{margin:6px 0 0;color:var(--ink2);font-size:13.5px}
.glass{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:18px;padding:14px 6px;margin-top:16px;text-align:center}
.glass div{border-right:1px solid var(--line);padding:0 4px}
.glass div:last-child{border:0}
.glass small{display:block;color:var(--muted);font-size:12px}
.glass b{display:block;font-size:17px;margin-top:5px}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .l{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth .form{width:100%;max-width:420px}
.auth .r{margin:16px;border-radius:30px;background:radial-gradient(ellipse 80% 60% at 65% 75%,rgba(255,107,26,.45),transparent 70%),#130c09;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.auth .r .covers{display:flex;align-items:flex-end;gap:14px;margin-bottom:40px}
.auth .r h2{font-size:34px;font-weight:800;letter-spacing:-.03em}
.auth .r p{opacity:.75;font-size:17px;margin-top:10px}
.auth h1{font-size:28px;font-weight:800;margin-top:22px}
.auth .sub{color:var(--muted);margin:8px 0 22px}
.pass{position:relative}
.pass input{padding-right:52px}
.pass .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.pass .eye svg{width:21px;height:21px}
.pass .eye:hover{background:var(--line)}
.pass .eye.on{color:var(--or)}
.auth input{background:var(--card);border-color:var(--line)}
.auth input:focus{border-color:var(--or)}
body.dark .auth input{background:var(--soft);border-color:#34343a}

/* ---------- premium / mood / misc ---------- */
.phero{border-radius:28px;padding:56px 30px 0;text-align:center;background:radial-gradient(circle at 50% 0,rgba(255,107,26,.35),transparent 60%),linear-gradient(180deg,#3a1d10,#1a0f0a);color:#fff;overflow:hidden}
.phero .ic{width:72px;height:72px;border-radius:20px;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;font-size:36px}
.phero h1{font-size:46px;font-weight:800;letter-spacing:-.03em;margin-top:22px;line-height:1.08}
.phero p{opacity:.8;font-size:18px;margin:14px auto 22px;max-width:520px}
.phero .covers{display:flex;justify-content:center;align-items:flex-end;gap:22px;margin-top:40px;transform:translateY(30px)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat div{border-radius:20px;background:var(--soft);padding:22px}
.feat .fi{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:40px}
.feat h3{font-size:19px}
.feat p{color:var(--muted);font-size:14px;line-height:1.55;margin:8px 0 0}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,360px));justify-content:center;gap:18px}
.plan{border-radius:22px;background:var(--soft);padding:6px}
.plan.best{background:var(--grad)}
.plan .h{padding:12px 14px;font-family:Lora,serif;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.plan.best .h{color:#fff}
.plan .h em{font-family:Inter;font-style:normal;font-size:12px;background:#fff;color:var(--or2);border-radius:20px;padding:4px 10px}
.plan .b{background:var(--card);border-radius:18px;padding:16px}
body.dark .plan .b{background:#0f0f12}
.plan .pr{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px}
.plan .pr span{font-size:14px;color:var(--muted);font-weight:600}
.faq{max-width:640px;margin:0 auto}
.faq details{border-radius:16px;background:var(--soft);padding:16px 18px;margin-bottom:10px}
.faq summary{font-weight:700;cursor:pointer}
.faq p{color:var(--ink2);line-height:1.55;margin:10px 0 0}
.mood{position:fixed;inset:0;z-index:50;overflow-y:auto;display:flex;flex-direction:column;align-items:center;color:#fff;transition:background 1s;padding:30px 20px}
.mood .q{font-size:20px;font-weight:700;margin-top:56px;text-align:center}
.mood .word{flex:1;display:flex;align-items:center;font-size:clamp(56px,11vw,120px);font-weight:800;letter-spacing:-.04em;text-shadow:0 10px 30px rgba(0,0,0,.08)}
.mood input[type=range]{-webkit-appearance:none;appearance:none;width:min(520px,100%);height:36px;border-radius:20px;background:rgba(255,255,255,.3);padding:0 4px}
.mood input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.mood input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:0}
.mood .ends{display:flex;justify-content:space-between;width:min(520px,100%);font-size:13px;font-weight:600;opacity:.85;margin-top:10px}
.mood .go{width:min(520px,100%);background:#fff;color:#16161a;font-weight:600;padding:16px;border-radius:30px;margin:24px 0 20px;font-size:16px}
.mood .close{position:absolute;left:24px;top:24px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.topics{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:640px;margin-top:26px}
.topics button{background:rgba(255,255,255,.18);color:#fff;font-weight:700;padding:11px 18px;border-radius:24px;font-size:14.5px}
.topics button.on{background:#fff;color:#16161a}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(900px,100%);margin-top:24px;padding-bottom:20px;flex:0 0 auto}
.recs .tile{flex:none}
.recs .tile{background:rgba(255,255,255,.16);color:#fff}
.recs .tile small{color:rgba(255,255,255,.8)}
.terms{max-width:820px;line-height:1.65;font-size:15px;color:var(--ink2)}
.terms h2{font-size:20px;color:var(--ink);margin:26px 0 10px;text-align:center}
.foot{border-top:1px solid var(--line);margin-top:50px;padding-top:24px;display:flex;gap:12px 24px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.foot a{text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;z-index:90;animation:fd .2s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr{cursor:pointer}
.tbl tr:hover td{background:var(--soft)}
.inst{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px;margin-bottom:16px}
.inst img{width:42px;height:42px;border-radius:11px}
.inst div{flex:1;font-size:13px;opacity:.8;line-height:1.35}
.inst b{display:block;font-size:15px;opacity:1}

/* ---------- mobile ---------- */
@media (max-width:980px){
  .side{display:none}
  .main{margin:0;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
  .main-in{border-radius:0;box-shadow:none;background:var(--bg)!important;padding:0 16px 30px;min-height:auto}
  .mtop{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 6px}
  .mtop .logo{padding:0;font-size:22px}
  .mtop .logo i{width:32px;height:32px}
  .mtop .r{display:flex;gap:8px;align-items:center}
  .mtop .ibtn{width:40px;height:40px;background:var(--card)}
  body.dark .mtop .ibtn{background:var(--soft)}
  .ph.desk{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end;z-index:40}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:4px 6px;font-weight:600;min-width:58px}
  .bnav a svg{width:24px;height:24px}
  .bnav a.on{color:var(--or)}
  .bnav .add{background:var(--grad);color:#fff;width:54px;height:54px;min-width:0;border-radius:17px;margin-bottom:6px;box-shadow:0 8px 20px rgba(255,107,26,.4);justify-content:center}
  .bnav .add svg{width:26px;height:26px}
  .card,.cont,.marra-c,.post,.brow,.composer,.pcard,.menu,.sts div,.facts,.tile{background:var(--card)!important}
  body.dark .card,body.dark .cont,body.dark .marra-c,body.dark .post,body.dark .brow,body.dark .composer,body.dark .pcard,body.dark .menu,body.dark .sts div,body.dark .facts,body.dark .tile{background:var(--soft)!important}
  body:not(.dark) .card,body:not(.dark) .post,body:not(.dark) .brow,body:not(.dark) .menu{box-shadow:var(--shadow)!important}
  .grid2,.davra,.prof,.mgrid,.bk{grid-template-columns:1fr}
  .prof>div:first-child{display:none}
  .davra .right,.bk .left{position:static}
  .davra .right{display:none}
  .bk{gap:10px}
  .bk h1{font-size:26px;text-align:center}
  .bk .au,.bk .kv{text-align:center;justify-content:center}
  .banner{padding:24px 22px}
  .banner h2{font-size:28px}
  .banner .art{font-size:60px}
  .shelf-grid{grid-template-columns:1fr}
  .feat{grid-template-columns:1fr}
  .plans{grid-template-columns:1fr}
  .phero h1{font-size:34px}
  .pcover{height:140px;border-radius:20px}
  .phead .ava{width:96px;height:96px;font-size:38px}
  .phead{margin-top:-48px;padding:0 12px}
  .pname{padding:12px 12px 0}
  .pname h1{font-size:23px}
  .sts b{font-size:18px}
  .tile{flex:0 0 150px}
  .tile .tp{height:160px}
  .ms{grid-template-columns:repeat(4,1fr)}
  .marra-c .in{flex-direction:column;align-items:stretch}.marra-c .ring{align-self:center}
  .tree{width:150px;height:150px;font-size:70px}
  .tree::after{bottom:30px;width:70px}
  .auth{grid-template-columns:1fr}
  .auth .r{display:none}
  .ov{align-items:flex-end;padding:0}
  .sheet{border-radius:26px 26px 0 0;max-height:93vh;animation:up .28s cubic-bezier(.2,.8,.2,1);padding:10px 20px calc(26px + env(safe-area-inset-bottom))}
  .grab{display:block;width:40px;height:5px;border-radius:4px;background:var(--line);margin:2px auto 16px}
  .sheet .x{display:none}
  .post .tx,.post .att,.post .acts,.post .cmts,.post .more{margin-left:0}
  .toast{bottom:110px}
  .tbl .hm{display:none}
}
@media (min-width:981px){.mob{display:none!important}}
.mood .recs .tile{background:rgba(255,255,255,.16)!important;box-shadow:none!important}.mood .recs .tile h4{color:#fff}.prem-strip span{white-space:nowrap}

.ico{flex:0 0 auto;vertical-align:-3px}
.sic{display:inline-flex;align-items:center;justify-content:center}
.chip .ico,.tag .ico,.btn .ico{vertical-align:-3px}
.empty .ic{color:var(--muted);display:flex;justify-content:center}
.mi .ic{color:#fff}
.banner .art{color:#fff;opacity:.95}
.tree{font-size:0!important}
.tree::after{display:none}
.ms .e{filter:grayscale(1);opacity:.4;display:flex;justify-content:center}
.ms .got .e{filter:none;opacity:1}
.kv span{display:inline-flex;align-items:center;gap:6px}
.feat .fi{color:inherit}
.phero .ic{color:#fff}
.side-prem .ico{vertical-align:-2px}

/* ---------- landing ---------- */
.land{background:var(--bg)}
.lw{max-width:1180px;margin:0 auto;padding:0 24px}
.lnav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 0;border-bottom:1px solid var(--line)}
.lnk{display:flex;gap:28px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.lnk a:hover{color:var(--or)}
.btn.lg{padding:16px 26px;font-size:16px;border-radius:16px}
.btn.pri.lg{box-shadow:0 12px 26px rgba(255,107,26,.35)}
.lhero{padding:60px 0 40px;overflow:hidden}
.lhero-in{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.lbadge{display:inline-flex;gap:8px;align-items:center;background:var(--or-soft);color:var(--or2);font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:30px}
.lhero h1{font-size:clamp(40px,5.4vw,68px);font-weight:800;letter-spacing:-.045em;line-height:1.02;margin:22px 0 18px}
.lhero h1 em{font-style:normal;color:var(--or)}
.lhero p{font-size:19px;line-height:1.55;color:var(--ink2);margin:0 0 28px;max-width:540px}
.lproof{display:flex;align-items:center;gap:14px;margin-top:28px;color:var(--muted);font-size:14.5px}
.lproof .ava{width:36px;height:36px;font-size:14px;box-shadow:0 0 0 3px var(--bg)}
.lproof b{color:var(--ink)}
.lart{position:relative;height:600px}
.lart::before{content:"";position:absolute;inset:40px 0 0 20px;border-radius:40%;background:radial-gradient(circle,rgba(255,107,26,.28),transparent 65%)}
.lphone{width:270px;border-radius:40px;background:#0b0b0d;padding:9px;box-shadow:0 0 0 1.5px #3a3a40,0 40px 80px rgba(0,0,0,.25)}
.lphone img{width:100%;display:block;border-radius:32px}
.lart .p1{position:absolute;left:40px;top:10px;transform:rotate(-5deg);z-index:2}
.lart .p2{position:absolute;right:10px;top:70px;transform:rotate(6deg)}
.lfl{position:absolute;z-index:3;background:var(--card);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 20px 40px rgba(0,0,0,.14);font-size:15px}
.lfl .sic{width:42px;height:42px;border-radius:12px}
.lfl small{display:block;color:var(--muted);font-size:12.5px}
.lfl.f1{left:-10px;top:330px}
.lfl.f2{right:0;top:470px}
.lsec{padding:70px 24px}
.lhead{text-align:center;max-width:720px;margin:0 auto 40px}
.lk{display:inline-block;color:var(--or);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.lsec h2,.lpain h2{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:10px}
.lsub{font-size:17.5px;line-height:1.6;color:var(--ink2);margin:16px 0 0}
.lpain{display:grid;grid-template-columns:1fr 1.1fr;gap:50px;align-items:center}
.lvs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lv{border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.lv b{font-size:19px;margin-bottom:4px}
.lv span{display:flex;gap:10px;align-items:center}
.lv.bad{background:var(--soft);color:var(--ink2)}

/* ---------- landing animatsiyalari ---------- */
.lhero{position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:0}
.blob.b1{width:420px;height:420px;background:#ff8a2b;right:6%;top:40px;animation:drift 14s ease-in-out infinite}
.blob.b2{width:300px;height:300px;background:#ffc06a;right:30%;top:300px;opacity:.35;animation:drift 18s ease-in-out infinite reverse}
.blob.b3{width:260px;height:260px;background:#f04e1c;left:-80px;top:-60px;opacity:.18;animation:drift 20s ease-in-out infinite}
body.dark .blob{opacity:.28}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
.lhero-in{position:relative;z-index:1}
.lart::before{animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
.lart .p1{animation:float1 7s ease-in-out infinite}
.lart .p2{animation:float2 8s ease-in-out infinite}
@keyframes float1{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-16px)}}
@keyframes float2{0%,100%{transform:rotate(6deg) translateY(0)}50%{transform:rotate(8deg) translateY(14px)}}
.lfl{animation:bob 5s ease-in-out infinite}
.lfl.f2{animation-delay:-2.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.rotw{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.rot{display:inline-block;transition:transform .32s cubic-bezier(.6,0,.4,1),opacity .32s}
.rot.out{transform:translateY(-100%);opacity:0}
.rot.inw{animation:rotin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rotin{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.lfeat>.rv.in{transition-delay:var(--d,0ms)}
.tilt{position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .8s}
.tilt::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,107,26,.13),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.tilt:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(20,20,30,.1)}
.tilt:hover::before{opacity:1}
.tilt:hover .sic{animation:wig .6s ease}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
.lstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:10px 0 0}
.lstats div{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);text-align:center}
.lstats b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--or)}
.lstats span{color:var(--muted);font-weight:600}
.lmarq{padding:60px 0 10px;overflow:hidden}
.mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);padding:14px 0}
.mqt{display:flex;gap:22px;width:max-content;animation:mq 60s linear infinite;align-items:center}
.mq.rev .mqt{animation-direction:reverse;animation-duration:70s}

.mqt .cover{transition:transform .3s}

@keyframes mq{to{transform:translateX(-50%)}}
.lsteps{position:relative}
.lsteps::before{content:"";position:absolute;left:12%;right:12%;top:52px;height:3px;background:linear-gradient(90deg,var(--or),#ffc06a);border-radius:3px;transform:scaleX(0);transform-origin:left;transition:transform 1.4s .3s cubic-bezier(.2,.8,.2,1);z-index:0}

.ltry{border-radius:34px;background:var(--card);box-shadow:var(--shadow);padding:44px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}

.tryweek b{width:36px;height:36px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;transition:.3s}
body.dark .tryweek b{background:#0f0f12}

<div id="app"></div>
<script>
/* ============================================================
   KITOBIM CORE — umumiy mantiq.
   Bir xil kod brauzerda (demo rejim) va Google Apps Script'da
   (haqiqiy server) ishlaydi. db = {users, books, posts, follows}
   ============================================================ */
var KitobimCore = (function () {
  var TABLES = ["users", "books", "posts", "follows", "media", "library", "payments", "promos", "certs"];
  /* Sertifikat darajalari: faol kunlar soni (ilovaga kirgan yoki kitob o'qigan kunlar) */
  var CERTS = [
    { id: "faol", days: 30, name: "Faol kitobxon", sub: "1 oy faol kitobxonlik uchun" },
    { id: "dostona", days: 90, name: "Do'stona", sub: "3 oy faol kitobxonlik uchun" },
    { id: "mehribon", days: 180, name: "Oltin Mehribon", sub: "6 oy faol kitobxonlik uchun" },
    { id: "fidoyi", days: 365, name: "Fidoyi", sub: "1 yil faol kitobxonlik uchun" }];
  var DAY_BALL = 2;   // har bir faol kun uchun ball
  var PLANS = { month: { days: 30, sum: 19000, name: "Oylik" }, year: { days: 365, sum: 149000, name: "Yillik" } };
  var MILESTONES = [[1, 10], [3, 30], [7, 70], [14, 150], [30, 300], [60, 600], [100, 1000], [365, 5000]];

  function now() { return new Date().toISOString(); }
  function rid(n) { var c = "abcdefghijkmnpqrstuvwxyz23456789", s = ""; for (var i = 0; i < (n || 12); i++) s += c[Math.floor(Math.random() * c.length)]; return s; }
  function normPhone(p) { var d = String(p || "").replace(/\D/g, ""); if (d.length === 9) d = "998" + d; return d; }
  function clean(s, max) { return String(s == null ? "" : s).replace(/[\u0000-\u0008\u000B-\u001F]/g, "").trim().slice(0, max || 200); }
  function bkey(t, a) { return (clean(t).toLowerCase() + "|" + clean(a).toLowerCase()).replace(/[‘’ʻʼ`´]/g, "'").replace(/\s+/g, " "); }
  function addDays(iso, n) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function fail(m) { var e = new Error(m); e.userMessage = m; throw e; }
  function int(v) { var n = parseInt(v, 10); return isNaN(n) || n < 0 ? 0 : n; }
  function isPrem(u, today) { return !!(u && u.premiumUntil && u.premiumUntil >= (today || now().slice(0, 10))); }
  function extendPrem(u, days, today) { var from = isPrem(u, today) ? u.premiumUntil : addDays(today, -1); u.premiumUntil = addDays(from, days); return u.premiumUntil; }
  /* Premium bo'lmaganlarga: 1-qismdan keyingi audio, mag'zi audiosi va to'liq mag'zi matni berilmaydi */
  function lockLib(L, prem) {
    if (!L || prem) return L;
    var o = {}; for (var k in L) o[k] = L[k];
    o.audio = (L.audio || []).map(function (a, i) { return i === 0 ? a : { title: a.title, size: a.size, locked: true }; });
    if (L.summaryAudio) o.summaryAudio = { locked: true, size: L.summaryAudio.size };
    var sm = String(L.summary || "");
    if (sm.length > 700) { var cut = sm.lastIndexOf("\n", 700); o.summary = sm.slice(0, cut > 250 ? cut : 600).trim(); o.summaryLocked = true; }
    return o;
  }

  /* ---------- hisob-kitob ---------- */
  function dayMap(books) {
    var m = {};
    books.forEach(function (b) { (b.sessions || []).forEach(function (s) { m[s.d] = (m[s.d] || 0) + Math.max(0, (s.to || 0) - (s.from || 0)); }); });
    return m;
  }
  function streakOf(m, today) { var n = 0, d = today; if (!m[d]) d = addDays(d, -1); while (m[d]) { n++; d = addDays(d, -1); } return n; }
  function bestStreak(m) {
    var days = Object.keys(m).filter(function (k) { return m[k] > 0; }).sort(), best = 0, cur = 0, prev = null;
    days.forEach(function (d) { cur = prev && addDays(prev, 1) === d ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
    return best;
  }
  function pagesRead(b) { return b.status === "done" ? int(b.pages) : b.status === "reading" ? int(b.current) : 0; }
  /* Kunlik faollik: kuniga bir marta hisoblanadi */
  function touchDay(u, today) {
    var d = today || now().slice(0, 10);
    if (u.actLast !== d) { u.act = (parseInt(u.act, 10) || 0) + 1; u.actLast = d; return true; }
    return false;
  }
  function certNo(db) {
    var y = now().slice(0, 4), mx = 0;
    (db.certs || []).forEach(function (c) { var m = String(c.id).match(/-(\d+)$/); if (m) mx = Math.max(mx, parseInt(m[1], 10)); });
    return "KTB-" + y + "-" + ("00000" + (mx + 1)).slice(-6);
  }
  function issueCert(db, u, tier, by) {
    var t = CERTS.filter(function (x) { return x.id === tier; })[0]; if (!t) fail("Sertifikat turi noto'g'ri");
    var has = (db.certs || []).filter(function (c) { return c.userId === u.id && c.tier === tier && !c.revoked; })[0];
    if (has) return has;
    var c = { id: certNo(db), userId: u.id, tier: tier, name: u.name, issuedAt: now(), by: by || "auto", act: parseInt(u.act, 10) || 0 };
    db.certs.push(c); return c;
  }
  /* Faol kunlar yetganda sertifikatlarni avtomatik beradi; yangi berilganlar ro'yxatini qaytaradi */
  function ensureCerts(db, u) {
    var out = [], a = parseInt(u.act, 10) || 0;
    CERTS.forEach(function (t) {
      if (a < t.days) return;
      var had = db.certs.some(function (c) { return c.userId === u.id && c.tier === t.id; });   // bekor qilingani ham qayta berilmaydi
      if (!had) out.push(issueCert(db, u, t.id, "auto"));
    });
    return out;
  }
  function stats(db, uid, today) {
    var bs = db.books.filter(function (b) { return b.userId === uid; });
    var m = dayMap(bs), week = 0, i;
    for (i = 0; i < 7; i++) week += m[addDays(today, -i)] || 0;
    var done = bs.filter(function (b) { return b.status === "done"; }).length;
    var pages = bs.reduce(function (a, b) { return a + pagesRead(b); }, 0);
    var posts = db.posts.filter(function (p) { return p.userId === uid; }).length;
    var best = bestStreak(m), bonus = 0;
    MILESTONES.forEach(function (ms) { if (best >= ms[0]) bonus += ms[1]; });
    var uu = (db.users || []).filter(function (x) { return x.id === uid; })[0], act = uu ? parseInt(uu.act, 10) || 0 : 0;
    bonus += act * DAY_BALL;
    var vals = Object.keys(m).map(function (k) { return m[k]; }).filter(function (v) { return v > 0; });
    var reading = bs.filter(function (b) { return b.status === "reading"; });
    return {
      done: done, reading: reading.length, plan: bs.filter(function (b) { return b.status === "plan"; }).length,
      pages: pages, week: week, today: m[today] || 0, streak: streakOf(m, today), best: best, posts: posts,
      record: vals.length ? Math.max.apply(null, vals) : 0, avg: vals.length ? Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length) : 0,
      ball: pages + done * 50 + posts * 5 + bonus, days: m, act: act,
      current: reading.map(function (b) { return { title: b.title, current: int(b.current), pages: int(b.pages) }; })
    };
  }

  /* ---------- foydalanuvchi ko'rinishlari ---------- */
  function counts(db, uid) {
    return { followers: db.follows.filter(function (f) { return f.b === uid; }).length, following: db.follows.filter(function (f) { return f.a === uid; }).length };
  }
  function pub(db, u, today) {
    if (!u) return { id: "", name: "O'chirilgan", username: "" };
    var c = counts(db, u.id), st = stats(db, u.id, today);
    return { id: u.id, name: u.name, username: u.username, bio: u.bio || "", createdAt: u.createdAt, lastActive: u.lastActive,
      private: !!u.private, followers: c.followers, following: c.following,
      ball: st.ball, done: st.done, pages: st.pages, week: st.week, streak: st.streak, color: u.color || 0, avatar: u.avatar || "", premium: isPrem(u, today) };
  }
  function self(db, u, today) {
    var p = pub(db, u, today);
    p.phone = u.phone; p.mustChange = !!u.mustChange; p.goal = u.goal || 20; p.region = u.region || ""; p.age = u.age || ""; p.gender = u.gender || ""; p.job = u.job || ""; p.premiumUntil = u.premiumUntil || ""; p.tg = !!u.tg; p.act = parseInt(u.act, 10) || 0;
    return {
      payments: (db.payments || []).filter(function (x) { return x.userId === u.id; }).slice(-8).reverse(),
      certs: (db.certs || []).filter(function (c) { return c.userId === u.id && !c.revoked; }),
      user: p, stats: stats(db, u.id, today),
      books: db.books.filter(function (b) { return b.userId === u.id; }),
      following: db.follows.filter(function (f) { return f.a === u.id; }).map(function (f) { return f.b; })
    };
  }
  function publicBook(b) {
    return { id: b.id, key: bkey(b.title, b.author), title: b.title, author: b.author, genre: b.genre || "", pages: b.pages, current: b.current,
      status: b.status, start: b.start, end: b.end, rating: b.rating || 0, recBy: b.recBy || "", gift: !!b.gift, giftFrom: b.giftFrom || "",
      experience: b.experience || "", recTo: b.recTo || "", updated: b.updated };
  }
  function postView(db, p, meId, today) {
    var u = db.users.filter(function (x) { return x.id === p.userId; })[0];
    var readers = p.bookKey ? db.books.filter(function (b) { return bkey(b.title, b.author) === p.bookKey; }).length : 0;
    return { id: p.id, user: pub(db, u, today), text: p.text, createdAt: p.createdAt, rating: p.rating || 0,
      book: p.bookKey ? { key: p.bookKey, title: p.bookTitle, author: p.bookAuthor, readers: readers } : null,
      likes: (p.likes || []).length, liked: (p.likes || []).indexOf(meId) >= 0, views: p.views || 0,
      comments: (p.comments || []).map(function (c) { var cu = db.users.filter(function (x) { return x.id === c.userId; })[0];
        return { id: c.id, text: c.text, createdAt: c.createdAt, user: cu ? { id: cu.id, name: cu.name, username: cu.username, color: cu.color || 0, avatar: cu.avatar || "" } : { name: "?" } }; }) };
  }
  function libView(L) {
    return { id: L.id, key: bkey(L.title, L.author), title: L.title, author: L.author, genre: L.genre || "", pages: int(L.pages), desc: L.desc || "", summary: L.summary || "", summaryAudio: L.summaryAudio || null,
      cover: L.cover || null, pdf: L.pdf || null, audio: L.audio || [], published: !!L.published, createdAt: L.createdAt, updated: L.updated };
  }

/* ---------- sha256 (parol shifrlash) ---------- */
function sha256(s) {
  s = unescape(encodeURIComponent(s));
  const K = [], H = []; let p = 2, c = 0;
  const frac = x => (x - Math.floor(x)) * 4294967296 | 0;
  while (c < 64) { let ok = true; for (let d = 2; d * d <= p; d++) if (p % d === 0) { ok = false; break; } if (ok) { if (c < 8) H[c] = frac(Math.pow(p, 1 / 2)); K[c++] = frac(Math.pow(p, 1 / 3)); } p++; }
  const w = [], l = s.length * 8; s += "\x80"; while (s.length % 64 - 56) s += "\x00";
  for (let i = 0; i < s.length; i++) w[i >> 2] |= s.charCodeAt(i) << ((3 - i) % 4) * 8;
  w[w.length] = (l / 4294967296) | 0; w[w.length] = l;
  const r = (v, n) => (v >>> n) | (v << (32 - n));
  for (let j = 0; j < w.length;) {
    const W = w.slice(j, j += 16), old = H.slice(0);
    for (let i = 0; i < 64; i++) {
      if (i >= 16) { const a = W[i - 15], b = W[i - 2]; W[i] = (W[i - 16] + (r(a, 7) ^ r(a, 18) ^ (a >>> 3)) + W[i - 7] + (r(b, 17) ^ r(b, 19) ^ (b >>> 10))) | 0; }
      const [a, b, cc, d, e, f, g, h] = H;
      const t1 = h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i];
      const t2 = (r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc));
      H.unshift((t1 + t2) | 0); H.pop(); H[4] = (H[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) H[i] = (H[i] + old[i]) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

function toast(t) { document.querySelectorAll(".toast").forEach(x => x.remove()); const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function ava(u, size = 44, ring = false) { const n = (u && u.name) || "?", img = u && /^data:image\//.test(u.avatar || "") ? u.avatar : "";
  return `<div class="ava ${ring ? "ring" : ""}" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px;background:${AVC[(u && u.color) || 0]}">${img ? `<img src="${img}" alt="">` : esc(n.trim()[0] || "?")}</div>`; }
let LIBMAP = {};
function setLib(list) { LIBMAP = {}; (list || []).forEach(l => LIBMAP[l.key] = l); LS.set("kitobim_lib", list || []); }
setLib(LS.get("kitobim_lib", []));
const libOf = b => b && (b.lib || LIBMAP[b.key || KitobimCore.bkey(b.title, b.author)]);
const fThumb = f => f ? (f.id ? `https://drive.google.com/thumbnail?id=${f.id}&sz=w800` : f.url) : "";
const fView = f => f ? (f.id ? `https://drive.google.com/file/d/${f.id}/preview` : /^https?:/.test(f.url) && /\.pdf($|\?)/i.test(f.url) ? `https://docs.google.com/viewer?embedded=true&url=${encodeURIComponent(f.url)}` : f.url) : "";
const fDown = f => f ? (f.id ? `https://drive.google.com/uc?export=download&id=${f.id}` : f.url) : "";
function cover(b, size = "") {
  const L = libOf(b), im = L && L.cover ? fThumb(L.cover) : "";
  if (im) return `<div class="cover ${size} img" style="background:#2a2a2e url('${esc(im)}') center/cover no-repeat">${L.audio && L.audio.length && size !== "xs" ? `<span class="cbadge">${ic("headph", 12)}</span>` : ""}</div>`;
  const [a, c] = palFor(b.title); return `<div class="cover ${size}" style="background:linear-gradient(160deg,${c},${a})"><div class="ca">${esc(b.author || APP_NAME)}</div><div class="ct">${esc(b.title)}</div><div class="cl"></div></div>`; }
function stars(n) { n = Math.round(n || 0); return n ? `<span class="stars">${"★".repeat(n)}<span style="opacity:.25">${"★".repeat(5 - n)}</span></span>` : ""; }
function ring(val, max, size, stroke, color = "var(--or)") {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, p = Math.min(1, max ? val / max : 0);
  return `<svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" style="transition:stroke-dashoffset .7s"/></svg>`;
}
function sheet(html) {
  closeSheet();

  ov.innerHTML = `<div class="sheet"><div class="grab"></div><button class="x" onclick="closeSheet()">✕</button>${html}</div>`;
  ov.addEventListener("click", e => { if (e.target === ov) closeSheet(); });
  document.body.appendChild(ov); document.body.style.overflow = "hidden";
}

/* ---------- router ---------- */
let renderSeq = 0;
async function render(keep) {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  route = { name: h[0] || "home", arg: decodeURIComponent(h.slice(1).join("/") || "") };
  applyTheme();
  closeSheet();
  if (route.name === "cert") return vCertPublic(route.arg);
  if (route.name === "terms" && !S.token) { $("#app").innerHTML = `<div style="padding:30px 20px;max-width:880px;margin:auto">${vTerms()}</div>`; return; }
  if (route.name === "admin") { $("#app").innerHTML = ""; return vAdmin(); }
  document.body.classList.remove("admbody");
  if (!S.token) { if (route.name === "login" || route.name === "register" || isStandalone()) { authMode = route.name === "register" ? "reg" : "login"; return vAuth(); } return vLanding(); }
  if (!$("#view")) shell();
  paintChrome();
  if (route.name === "mood") return vMood();
  const seq = ++renderSeq, view = $("#view");
  const m = isM(), SUB = ["menu", "personal", "donat", "bonus", "display", "about", "plans", "pay", "premium", "book", "payments"];
  document.body.className = document.body.className.replace(/\br-\S+/g, "").trim() + " r-" + route.name;
  document.body.classList.toggle("sub", SUB.includes(route.name));
  const pages = { library: vLibrary, home: m ? vHomeM : vHome, shelf: m && !route.arg ? vShelfHub : vShelf, book: vBook, marra: vMarra, davra: m ? vDavraM : vDavra, profile: m ? vProfileM : vProfile, user: vProfile, settings: m ? vMenu : vSettings, premium: m ? vPremiumM : vPremium, search: vSearch, terms: vTerms, notifs: vNotifs,
    menu: vMenu, personal: vPersonal, donat: vDonat, bonus: vBonus, display: vDisplay, about: vAbout, plans: vPlans, pay: vPay, payments: vPayments };
  const fn = pages[route.name] || (m ? vHomeM : vHome);
  setTimeout(miniPaint, 0);
  const html = fn(route.arg);
  if (typeof html === "string") { view.innerHTML = html; if (!keep) window.scrollTo(0, 0); swipeIn(); return; }
  if (keep) { try { const out = await html; if (seq === renderSeq) { const y = scrollY; view.innerHTML = out; scrollTo(0, y); } } catch (e) {} return; }
  let shown = false; const sk = setTimeout(() => { if (seq === renderSeq && !shown) view.innerHTML = mtop("", true) + `<div class="skel" style="height:44px;width:40%;margin:10px 0 24px"></div><div class="skel" style="height:220px"></div><div class="skel" style="height:140px;margin-top:16px"></div>`; }, 120);
  window.scrollTo(0, 0);
  try { const out = await html; shown = true; clearTimeout(sk); if (seq === renderSeq) { view.innerHTML = out; window.scrollTo(0, 0); swipeIn(); } }
  catch (e) { shown = true; clearTimeout(sk); if (seq === renderSeq) view.innerHTML = mtop("", true) + `<div class="empty"><div class="ic">${ic("sad",44)}</div>${esc(e.message)}<br><br><button class="btn pri" onclick="render()">Qayta urinish</button></div>`; }
}
window.addEventListener("hashchange", () => render());

let landTimers = [];
function initLanding() {
  landTimers.forEach(clearInterval); landTimers = [];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // scroll bilan paydo bo'lish
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll(".land .rv").forEach(el => reduce ? el.classList.add("in") : io.observe(el));
  // aylanuvchi so'z
  const words = ["telefonda", "cho'ntagingizda", "kompyuterda", "har doim yoningizda"]; let wi = 0; const rot = $(".rot");
  if (rot && !reduce) landTimers.push(setInterval(() => { if (!document.body.contains(rot)) return; rot.classList.add("out"); setTimeout(() => { wi = (wi + 1) % words.length; rot.textContent = words[wi]; rot.classList.remove("out"); rot.classList.add("inw"); setTimeout(() => rot.classList.remove("inw"), 450); }, 320); }, 2600));
  // kartalarda yorug'lik
  document.querySelectorAll(".land .tilt").forEach(el => el.addEventListener("pointermove", e => { const r = el.getBoundingClientRect(); el.style.setProperty("--mx", (e.clientX - r.left) + "px"); el.style.setProperty("--my", (e.clientY - r.top) + "px"); }));
  // sinab ko'ring
  const R = $("#tryR"), goal = 20;
  const draw = () => { const v = +R.value; $("#tryRing").innerHTML = ring(v, goal, 190, 15) + `<div class="lbl"><small>Bugungi reja</small><b>${v}<span style="font-size:16px;color:var(--muted)">/${goal}</span></b><span>bet</span></div>`;
    $("#tryM").innerHTML = v >= goal ? `<span class="ok">${ic("check", 18)} Bugungi reja bajarildi! Seriya davom etmoqda</span>` : v ? `Yana <b>${goal - v} bet</b> o'qisangiz, kunlik maqsad bajariladi` : `Bugun hali o'qimadingiz — 10 bet ham yetarli`;
    $("#tryW").innerHTML = WD.map((l, i) => `<div class="${i < 4 || (i === 4 && v >= goal) ? "on" : ""} ${i === 4 ? "td" : ""}"><b>${i < 4 || (i === 4 && v >= goal) ? ic("check", 14) : i + 17}</b><span>${l}</span></div>`).join(""); };
  if (R) { R.addEventListener("input", draw); draw(); }
  // haqiqiy statistika (faqat yetarlicha kitobxon bo'lsa ko'rsatiladi)
  rawCall([["publicStats", {}]]).then(([r]) => {
    if (!r || !r.ok || r.readers < 20) return; const box = $("#lstats"); if (!box) return;
    box.innerHTML = [["readers", "kitobxon"], ["pages", "o'qilgan bet"], ["done", "tugatilgan kitob"], ["posts", "Davradagi fikr"]].map(([k, n]) => `<div><b data-n="${r[k]}">0</b><span>${n}</span></div>`).join("");
    box.classList.remove("hidden");
    const run = () => box.querySelectorAll("b").forEach(b => { const n = +b.dataset.n, t0 = performance.now(); const f = t => { const p = Math.min(1, (t - t0) / 1400); b.textContent = num(Math.round(n * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
    new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { run(); o.disconnect(); } }).observe(box);
  }).catch(() => {});
}

function readForm() {
  const v = id => { const e = $("#" + id); return e ? e.value.trim() : undefined; };

  [["title", "fTitle"], ["author", "fAuthor"], ["start", "fStart"], ["end", "fEnd"], ["planDate", "fPlanDate"], ["recBy", "fRecBy"], ["giftFrom", "fGiftFrom"], ["experience", "fExp"], ["recTo", "fRecTo"], ["genre", "fGenre"]].forEach(([k, id]) => set(k, id));
  set("pages", "fPages", 1); set("current", "fCurrent", 1);

/* ---------- rasm yuklash (avatar / banner) ---------- */
function pickImage(kind) {
  const has = kind === "avatar" ? !!S.me.user.avatar : !!(RC[rcKey("user", { userId: S.me.user.id })] || {}).r?.banner;
  if (!has) return pickFile(kind);
  sheet(`<h2>${kind === "avatar" ? "Profil rasmi" : "Banner"}</h2><div class="menu" style="margin-top:14px">
    <button class="mi" onclick="closeSheet();pickFile('${kind}')"><span class="ic" style="background:var(--or)">${ic("cam", 18)}</span><span>Yangi rasm yuklash</span></button>
    <button class="mi" onclick="closeSheet();saveImage('${kind}','')"><span class="ic" style="background:#e5484d">${ic("trash", 18)}</span><span>Rasmni o'chirish</span></button></div>`);
}
function pickFile(kind) { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.onchange = () => i.files[0] && uploadImage(kind, i.files[0]); i.click(); }
function loadImg(file) { return new Promise((ok, no) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { ok(im); URL.revokeObjectURL(u); }; im.onerror = () => no(new Error("Rasmni o'qib bo'lmadi")); im.src = u; }); }
function squeeze(im, W, H, max) {
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
  const r = Math.max(W / im.width, H / im.height), w = im.width * r, h = im.height * r;
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  for (const q of [.82, .74, .66, .58, .5, .42, .35]) { const d = c.toDataURL("image/jpeg", q); if (d.length <= max) return d; }
  return null;
}
async function uploadImage(kind, file) {
  if (!/^image\//.test(file.type)) return toast("Faqat rasm yuklash mumkin");
  try {
    toast("Rasm tayyorlanmoqda…");
    const im = await loadImg(file);
    let d = kind === "avatar" ? squeeze(im, 160, 160, 13000) : squeeze(im, 960, 320, 45000);
    if (!d && kind === "banner") d = squeeze(im, 720, 240, 45000);
    if (!d) return toast("Rasm juda katta, boshqasini tanlang");
    await saveImage(kind, d);
  } catch (e) { toast(e.message); }
}
async function saveImage(kind, data) {
  // darhol ko'rsatamiz
  if (kind === "avatar") { S.me.user.avatar = data; paintChrome(); const a = $(".pava .ava"); if (a) a.outerHTML = ava(S.me.user, 128); }
  else { const c = $(".pcover"); if (c) c.style.backgroundImage = data ? `url('${data}')` : ""; }
  try {
    const r = await api("setMedia", { kind, data });
    const k = rcKey("user", { userId: S.me.user.id }); if (RC[k]) { RC[k].r.banner = kind === "banner" ? data : RC[k].r.banner; RC[k].r.user.avatar = S.me.user.avatar; rcSave(); }
    toast(data ? "Rasm saqlandi ✓" : "Rasm o'chirildi"); if (route.name === "profile") render(true);
  } catch (e) { toast("Saqlanmadi: " + e.message); }
}

function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  return d;
}
function spark(vals, color, w = 220, h = 64) {
  const max = Math.max(1, ...vals), min = Math.min(...vals), n = vals.length;
  const pts = vals.map((v, i) => [i * (w / (n - 1 || 1)), h - 6 - ((v - min) / ((max - min) || 1)) * (h - 14)]);
  const id = "g" + Math.random().toString(36).slice(2, 7), path = smoothPath(pts), last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${path} L${w},${h} L0,${h} Z" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    <line x1="0" x2="${w}" y1="${h - 6}" y2="${h - 6}" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 4"/><circle cx="${last[0] - 2}" cy="${last[1]}" r="4" fill="${color}" stroke="#1a1310" stroke-width="2"/></svg>`;
}
function gauge(pct) {
  const cx = 150, cy = 140, r = 108, segs = [["#e8452c", 0, .2], ["#f7a03a", .22, .47], ["#b07ae8", .49, .74], ["#3bb54a", .76, 1]];
  const P = t => { const a = Math.PI * (1 - t); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
  const arc = (t0, t1) => { const [x0, y0] = P(t0), [x1, y1] = P(t1); return `M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}`; };
  const [kx, ky] = P(Math.max(.01, Math.min(.99, pct)));
  return `<svg viewBox="0 0 300 160" class="gauge">${segs.map(([c, a, b]) => `<path d="${arc(a, b)}" stroke="${c}" stroke-width="30" fill="none" stroke-linecap="round" opacity="${pct >= a ? 1 : .35}"/>`).join("")}
    <g transform="translate(${kx},${ky}) rotate(${-180 * (1 - pct) + 90})"><rect x="-17" y="-13" width="34" height="26" rx="7" fill="none" stroke="#fff" stroke-width="5"/></g></svg>`;
}
function bigChart(vals, labels, color) {
  const W = 760, H = 300, pl = 34, pb = 26, max = Math.max(4, ...vals), raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(x => x >= raw);
  const top = step * 4, n = vals.length, xw = (W - pl - 10) / (n - 1 || 1);
  const pts = vals.map((v, i) => [pl + i * xw, (H - pb) - (v / top) * (H - pb - 12)]);
  const path = smoothPath(pts), id = "bg" + Math.random().toString(36).slice(2, 7);
  const grid = [0, 1, 2, 3, 4].map(k => { const y = (H - pb) - k * (H - pb - 12) / 4; return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="0" y="${y + 4}" class="ax">${k * step}</text>`; }).join("");
  const every = Math.ceil(n / 8);
  const xl = labels.map((l, i) => i % every === 0 || i === n - 1 ? `<text x="${pl + i * xw}" y="${H - 6}" class="ax" text-anchor="middle">${l}</text>` : "").join("");
  const dots = pts.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="10" fill="transparent"><title>${labels[i]}: ${vals[i]}</title></circle>`).join("");
  const mi = vals.indexOf(Math.max(...vals)), [mx, my] = pts[mi];
  return `<svg viewBox="0 0 ${W} ${H}" class="bigc"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>

    <path d="${path} L${pts[n - 1][0]},${H - pb} L${pl},${H - pb} Z" fill="url(#${id})"/>

    ${vals[mi] ? `<line x1="${mx}" x2="${mx}" y1="${my}" y2="${H - pb}" stroke="${color}" stroke-dasharray="3 4" opacity=".6"/><circle cx="${mx}" cy="${my}" r="5" fill="${color}" stroke="#1a1310" stroke-width="2.5"/><g transform="translate(${Math.min(W - 70, Math.max(40, mx))},${Math.max(14, my - 18)})"><rect x="-30" y="-14" width="60" height="22" rx="11" fill="#fff"/><text y="2" text-anchor="middle" class="tip">${vals[mi]}</text></g>` : ""}${dots}</svg>`;
}

      const L = await lameLib(), enc = new L.Mp3Encoder(ch, rate, 64), pcm = new Int16Array(data.buffer.slice(data.byteOffset, data.byteOffset + (data.length & ~1))), out = [];

        const fr = pcm.subarray(i, i + step);
        const b = ch === 2 ? enc.encodeBuffer(fr.filter((_, k) => !(k & 1)), fr.filter((_, k) => k & 1)) : enc.encodeBuffer(fr);
        if (b.length) out.push(new Uint8Array(b)); if ((i / step) % 300 === 0) await new Promise(r => setTimeout(r));

    } catch (e) { throw new Error(`${file.name}: WAV ni MP3 ga aylantirib bo'lmadi`); }
  }

    const u = new Uint8Array(await file.arrayBuffer()), parts = []; let st = 0;
    while (st < u.length) {

  if (P && (AUD.loading || (!a.paused && a.readyState < 3))) P.innerHTML = `<i class="aispin" style="width:28px;height:28px;border-width:3px"></i>`;
  else if (P) P.innerHTML = a.paused ? ic("play", 30, 'fill="currentColor"') : `<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>`;
  if (T) T.classList.toggle("on", !!(AUD.sleepT || AUD.sleepEnd));
  const mp = $("#miniP"); if (mp) mp.innerHTML = AUD.loading ? `<i class="aispin" style="width:20px;height:20px"></i>` : a.paused ? ic("play", 22, 'fill="currentColor"') : `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>`;
  const mb = $("#miniB"); if (mb) mb.style.width = (d ? c / d * 100 : 0) + "%";
}
function plToggle() { const a = audEl(); if (AUD.loading) return; if (AUD.err) return plTrack(AUD.i, true); if (a.paused) a.play().catch(() => toast("Audio ochilmadi. Internetni tekshiring")); else a.pause(); }
function plSkip(s) { const a = audEl(); a.currentTime = Math.max(0, Math.min((a.duration || 1e9) - 1, a.currentTime + s)); }
function plSeek(v) { const a = audEl(); if (a.duration) a.currentTime = a.duration * v / 1000; }
function plSpeed() { const L = [1, 1.25, 1.5, 1.75, 2, 0.75], a = audEl(); AUD.speed = L[(L.indexOf(AUD.speed) + 1) % L.length]; a.playbackRate = AUD.speed; LS.set("kitobim_speed", AUD.speed); const b = $("#plS"); if (b) b.textContent = AUD.speed + "x"; }
function plSleep() {

  sheet(`<div class="shead">Uyqu taymeri</div>${[15, 30, 45, 60].map(m => `<button class="srow" onclick="${set(m)}">${ic("cal", 19)}<span>${m} daqiqadan keyin</span></button>`).join("")}

}
function plSleepSet(m) {
  clearTimeout(AUD.sleepT); AUD.sleepT = 0; AUD.sleepEnd = m === -1;
  if (m > 0) AUD.sleepT = setTimeout(() => { audEl().pause(); AUD.sleepT = 0; plPaint(); toast("Uyqu taymeri: pleyer to'xtatildi"); }, m * 60000);
  plPaint(); toast(m === 0 ? "Taymer o'chirildi" : m === -1 ? "Qism oxirida to'xtaydi" : `${m} daqiqadan keyin to'xtaydi`);
}
